<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h2>Tela de Aluno</h2>
    <form action="#">
        <label for="campo_nome">NOME: </label>
        <input type="text" name="nome_usuario" id="campo_nome">
        <br><br>

        <label for="campo_email">EMAIL: </label>
        <input type="email" name="email_usuario" id="campo_email">
        <br><br>

        <label for="campo_telefone">Numero de Telefone</label>
        <input type="number" name="contato_usuario" id="campo_telefone">

        <br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
