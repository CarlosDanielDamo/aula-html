<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario do Aluno</title>
</head>
<body>
    <h2>Formulario do Aluno</h2>

    <form action="#" style="width: 480px; height: 180px; border: 2px solid black; padding: 1%; margin-left: 2px;">
        <label for="campo_nome" style="background-color: cadetblue; padding: 2px;">NOME: </label>
        <input type="text" name="nome_usuario" id="campo_nome" style="width: 82%; border-radius: 4px;">
        <br> <br>

        <label for="campo_email" style="background-color: cadetblue; padding: 2px;"">E-MAIL: </label>
        <input type="email" name="email-usuario" id="campo_email" style="width: 80%; border-radius: 4px;">
        <br><br>

        <label for="campo_idade" style="background-color: cadetblue; padding: 2px;"">IDADE: </label>
        <input type="number" name="idade_usuario" id="campo_idade" style="border-radius: 4px;">

        <label for="campo_cep" style="margin-left: 15px; background-color: cadetblue; padding: 2px;">CEP:</label>
        <input type="number" name="cep_usuario" id="campo_cep" style="width: 33%; border-radius: 4px;" placeholder="EX:892771-440">
        <br><br>

        <label for="campo_senha" style="background-color: cadetblue; padding: 2px;">SENHA: </label>
        <input type="password" name="senha_usuario" id="campo_senha" style="width: 81%; border-radius: 4px;">
        <br>

        <input type="submit" value="Login">
    </form>
    
</body>
</html>
